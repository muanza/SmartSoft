# Test configuration uses H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable PostgreSQL-specific features for H2 tests
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT test secret (32-char base64 encoded)
smartsoft.jwt.secret=dGVzdC1zZWNyZXQtZm9yLXVuaXQtdGVzdHMtb25seS0xMjM=
smartsoft.jwt.expiration-ms=3600000

# Disable scheduled backup in tests
smartsoft.backup.schedule=0 0 3 31 2 ?
