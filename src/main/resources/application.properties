# ============================================================
# SmartSoft Application Configuration
# ============================================================

# Server
server.port=8080
server.servlet.context-path=/
spring.application.name=smartsoft

# ============================================================
# PostgreSQL DataSource
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartsoft_db}
spring.datasource.username=${DB_USER:smartsoft}
spring.datasource.password=${DB_PASSWORD:smartsoft123}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.pool-name=SmartSoftPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ============================================================
# JWT Configuration
# ============================================================
# IMPORTANT: Set a strong 512-bit Base64-encoded secret in production via env var
smartsoft.jwt.secret=${JWT_SECRET:c21hcnRzb2Z0LXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLTIwMjQtc2VjdXJl}
smartsoft.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================================
# Backup Schedule (cron: at 02:00 every day)
# ============================================================
smartsoft.backup.schedule=0 0 2 * * ?

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ============================================================
# Logging
# ============================================================
logging.level.root=WARN
logging.level.com.smartsoft=INFO
logging.level.org.hibernate.SQL=WARN

# ============================================================
# Multipart (for file uploads if needed)
# ============================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
