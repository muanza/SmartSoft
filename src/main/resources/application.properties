spring.application.name=smartsoft
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SMARTSOFT_DB_URL:jdbc:postgresql://localhost:5432/smartsoft}
spring.datasource.username=${SMARTSOFT_DB_USERNAME:smartsoft}
spring.datasource.password=${SMARTSOFT_DB_PASSWORD:smartsoft}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SMARTSOFT_DDL_AUTO:update}
spring.jpa.show-sql=${SMARTSOFT_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.multiTenancy=DATABASE
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.smartsoft.config.TenantIdentifierResolver
spring.jpa.properties.hibernate.multi_tenant_connection_provider=com.smartsoft.config.MultiTenantConnectionProviderImpl

spring.datasource.hikari.maximum-pool-size=${SMARTSOFT_DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${SMARTSOFT_DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=${SMARTSOFT_DB_POOL_TIMEOUT_MS:30000}

management.endpoints.web.exposure.include=health,info
