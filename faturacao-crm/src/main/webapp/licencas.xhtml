<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>CRM</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>
<h:body>
<header><h1>CRM de Licenciamento</h1></header>
<nav>
    <h:link outcome="dashboard" value="Dashboard" />
    <h:link outcome="tenants" value="Tenants" />
    <h:link outcome="licencas" value="Licenças" />
    <h:link outcome="parceiros" value="Parceiros" />
    <h:link outcome="banners" value="Banners" />
    <h:link outcome="comunicados" value="Comunicados" />
    <h:link outcome="maquinas" value="Máquinas" />
</nav>

<section class="card">
    <h2>Licenças</h2>
    <h:form>
        <h:dataTable value="#{licencaController.licencas}" var="licenca">
            <h:column><f:facet name="header">Tenant</f:facet>#{licenca.tenantNif}</h:column>
            <h:column><f:facet name="header">Chave</f:facet>#{licenca.chaveActivacao}</h:column>
            <h:column><f:facet name="header">Estado</f:facet>#{licenca.estado}</h:column>
        </h:dataTable>
    </h:form>
</section>
<section class="card">
    <h:form>
        <h:inputText value="#{licencaController.licencaForm.tenantNif}" required="true"/>
        <h:inputText value="#{licencaController.licencaForm.planoId}" required="true"/>
        <h:inputText value="#{licencaController.licencaForm.chaveActivacao}"/>
        <h:commandButton value="Emitir licença" action="#{licencaController.salvar}"/>
    </h:form>
</section>

</h:body>
</html>
