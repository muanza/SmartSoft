<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Login CRM</title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>
<h:body>
<header><h1>CRM de Licenciamento</h1></header>
<section class="card">
    <h:form>
        <h:messages globalOnly="true"/>
        <h:outputLabel for="email" value="Email"/>
        <h:inputText id="email" value="#{authController.email}"/>
        <h:outputLabel for="password" value="Palavra-passe"/>
        <h:inputSecret id="password" value="#{authController.password}"/>
        <h:commandButton value="Entrar" action="#{authController.login}"/>
    </h:form>
</section>
</h:body>
</html>
