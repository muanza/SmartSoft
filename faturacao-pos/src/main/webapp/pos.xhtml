<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>POS</title>
    <h:outputStylesheet library="css" name="pos.css"/>
    <h:outputScript library="js" name="pos.js"/>
</h:head>
<h:body styleClass="#{posController.bloqueado ? 'locked' : ''}">
<header><h1>POS e Faturação</h1></header>
<nav>
    <h:link outcome="pos" value="POS" />
    <h:link outcome="vendas" value="Vendas" />
    <h:link outcome="produtos" value="Produtos" />
    <h:link outcome="stock" value="Stock" />
    <h:link outcome="clientes" value="Clientes" />
    <h:link outcome="utilizadores" value="Utilizadores" />
    <h:link outcome="facturas" value="Facturas" />
    <h:link outcome="configuracao" value="Configuração" />
</nav>

<section class="panel">
    <h:messages globalOnly="true"/>
    <p>Tenant activo: #{posController.tenantNif}</p>
    <p>Caixa aberta: #{posController.caixaAberta}</p>
    <h:form>
        <h:commandButton value="Abrir caixa" action="#{posController.abrirCaixa}" />
        <h:commandButton value="Fechar caixa" action="#{posController.fecharCaixa}" />
        <h:commandButton value="Bloquear ecrã" action="#{posController.bloquearEcrã}" />
        <h:commandButton value="Full screen" type="button" onclick="toggleFullScreen(); return false;" />
    </h:form>
</section>
<section class="panel">
    <h2>Carrinho</h2>
    <h:form>
        <h:inputText value="#{posController.linhaActual.descricao}" required="true"/>
        <h:inputText value="#{posController.linhaActual.quantidade}"/>
        <h:inputText value="#{posController.linhaActual.precoUnitario}"/>
        <h:commandButton value="Adicionar linha" action="#{posController.adicionarLinha}" />
    </h:form>
    <h:dataTable value="#{posController.carrinho}" var="linha">
        <h:column><f:facet name="header">Descrição</f:facet>#{linha.descricao}</h:column>
        <h:column><f:facet name="header">Qtd</f:facet>#{linha.quantidade}</h:column>
        <h:column><f:facet name="header">Preço</f:facet>#{linha.precoUnitario}</h:column>
    </h:dataTable>
</section>

</h:body>
</html>
